name: Update Recently Shipped

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_recently_shipped.py"
      - ".github/workflows/recently-shipped.yml"

concurrency:
  group: recently-shipped
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update profile releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_recently_shipped.py
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No profile update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh recently shipped"
          git push
