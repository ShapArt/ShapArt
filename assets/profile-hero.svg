<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ShapArt — Security Automation Engineer</title>
  <desc id="desc">Animated dark technical banner for Artyom Shapovalov: security automation, backend, SIEM and enterprise tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.55" stop-color="#0B1017"/>
      <stop offset="1" stop-color="#07100E"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7FF4F"/>
      <stop offset="0.48" stop-color="#62E6D7"/>
      <stop offset="1" stop-color="#78A8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(992 70) rotate(140) scale(420 310)">
      <stop stop-color="#62E6D7" stop-opacity=".13"/>
      <stop offset="1" stop-color="#62E6D7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#B9C5D6" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glow)"/>

  <g opacity=".7">
    <circle cx="1090" cy="-10" r="130" fill="#62E6D7" opacity=".05" filter="url(#blur)"/>
    <circle cx="118" cy="414" r="118" fill="#78A8FF" opacity=".04" filter="url(#blur)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="56" y="44" width="1088" height="332" rx="22" fill="#0A0F15" fill-opacity=".72" stroke="#B9C5D6" stroke-opacity=".15"/>
    <circle cx="86" cy="72" r="5" fill="#FF6B6B"/>
    <circle cx="104" cy="72" r="5" fill="#FFD166"/>
    <circle cx="122" cy="72" r="5" fill="#A7FF4F"/>
    <text x="150" y="78" font-size="14" fill="#8290A3">shapart@github:~</text>

    <text x="84" y="132" font-size="15" fill="#62E6D7">$ whoami</text>
    <text x="84" y="188" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1" fill="#F2F6FA">ARTYOM SHAPOVALOV</text>
    <text x="84" y="222" font-size="16" fill="#A7B3C2">Security Automation · Backend · SIEM/SOC · Enterprise Tooling</text>

    <g transform="translate(84 256)">
      <rect width="240" height="38" rx="19" fill="#101821" stroke="#A7FF4F" stroke-opacity=".35"/>
      <text x="18" y="25" font-size="13" fill="#DCE5EE">BMSTU IU8 · 5th year</text>
      <rect x="252" width="298" height="38" rx="19" fill="#101821" stroke="#62E6D7" stroke-opacity=".35"/>
      <text x="270" y="25" font-size="13" fill="#DCE5EE">Cherkizovo Infotech · 02.2026 → now</text>
      <rect x="562" width="188" height="38" rx="19" fill="#101821" stroke="#78A8FF" stroke-opacity=".35"/>
      <text x="580" y="25" font-size="13" fill="#DCE5EE">Alfa CTF · #45</text>
    </g>

    <text x="84" y="330" font-size="14" fill="#62E6D7">$ current_focus</text>
    <text x="222" y="330" font-size="14" fill="#C8D2DE">turn risky manual workflows into reviewable automation</text>
    <rect x="669" y="316" width="9" height="18" rx="2" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0.12;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="56" y="394" width="1088" height="2" rx="1" fill="url(#accent)" opacity=".8">
    <animate attributeName="opacity" values=".35;.95;.35" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="56" y="44" width="1088" height="1" fill="#62E6D7" opacity=".08">
    <animate attributeName="y" values="44;375;44" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.16;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>